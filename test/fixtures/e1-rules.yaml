# E1 rules (design/test-corpus-v2.md E1): a campaign package in the library.
# Its rules name world things by key (nuln, gunnery_school), so they are campaign rules, not
# book rules (owner, 15 Nov): a book's rules don't know any one world.

package: [E1 rules, e1_rules]
edition: wfb6
layer: campaign
requires: [wfb6_base]

scopes:
  - scope: [commissioned by the treasury, commissioned_by_the_treasury]
    query: reaches(wissenland_treasury, serves > paid_by)

rules:
  - rule: [Nuln civic pride, nuln_civic_pride]
    effect: [Ld, +1]
    scope: reaches(nuln, raised_at > in*)
    nature: origin
    category: place

  - rule: [Gunnery School, gunnery_school_pride]
    effect: [Ld, =8, inline]
    scope: reaches(gunnery_school, member_of)
    nature: origin
    category: organisation
