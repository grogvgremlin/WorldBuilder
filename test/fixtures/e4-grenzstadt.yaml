# E4. Grenzstadt spinach, first part  (design/test-corpus-v2.md E4)
# Origin is read as of raising (2520), so the Spearmen keep +1 S after Grenzstadt passes to
# Stirland (2523) and after the blight ends the spinach (2524).
# "+1 Ld while the Elector holds Grenzstadt" is environment (read now) and stops in 2523.

package: [E4 Grenzstadt spinach, e4_grenzstadt]
layer: book

things:
  - [Grenzstadt, grenzstadt, [settlement]]
  - [Averland, averland, [polity]]
  - [Stirland, stirland, [polity]]
  - [Elector of Averland, elector_of_averland, [title]]
  - [Elector of Stirland, elector_of_stirland, [title]]

links:
  - [grenzstadt, in, averland, 2400, 2523]
  - [grenzstadt, in, stirland, 2523]
  - [grenzstadt, ruled_by, elector_of_averland, 2400, 2523]
  - [grenzstadt, ruled_by, elector_of_stirland, 2523]

events:
  - event: [Spinach grows in Averland, averland_spinach]
    kind: spinach_harvest
    roles: {where: averland}
    period: [2400, 2524]   # the blight ends it in 2524

units:
  - unit: [Grenzstadt Spearmen, grenzstadt_spearmen]
    raised: 2520
    profile: [4, 3, 3, 3, 3, 1, 3, 1, 7]
    links:
      - [raised_at, grenzstadt]

rules:
  - rule: [Extra training spinach, averland_spinach_strength]
    effect: [S, +1]
    scope: reaches(averland, raised_at > in*)
    trigger: in_force(spinach_harvest, where = averland)
    nature: origin
    category: place

  - rule: [Averland levy, averland_levy_while_elector_holds]
    effect: [Ld, +1]
    scope: reaches(grenzstadt, raised_at)
    trigger: reaches(elector_of_averland, raised_at > ruled_by)
    nature: environment
    category: title
