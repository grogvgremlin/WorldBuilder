# E1. Handgunners' Ld: 8 or 7  (design/test-corpus-v2.md E1)
# Read 2525 with "wages withheld" in force -> 7. Withdraw that log entry -> 8.

package: [E1 Handgunners' Ld, e1_handgunners]
layer: book

things:
  - [Nuln, nuln, [settlement, polity]]
  - [Wissenland, wissenland, [polity]]
  - [Gunnery School, gunnery_school, [organisation]]
  - [Wissenland treasury, wissenland_treasury, [organisation]]
  - [Handgunners' commission, handgunner_commission, [commission]]

links:
  # [from, kind, to, start, end]
  - [nuln, in, wissenland, 2000]
  - [handgunner_commission, paid_by, wissenland_treasury, 2519]

units:
  - unit: [Nuln Handgunners, nuln_handgunners]
    raised: 2520
    profile: [3, 3, 3, 3, 3, 1, 3, 1, 7]   # M WS BS S T W I A Ld
    links:
      # [kind, to, start, end]; start defaults to the raising date
      - [raised_at, nuln]
      - [member_of, gunnery_school]
      - [serves, handgunner_commission]
      - [stationed_at, nuln]

scopes:
  - scope: [commissioned by the treasury, commissioned_by_the_treasury]
    query: reaches(wissenland_treasury, serves > paid_by)

rules:
  - rule: [Nuln civic pride, nuln_civic_pride]
    effect: [Ld, +1]
    scope: reaches(nuln, raised_at > in*)
    nature: origin
    category: place

  - rule: [Gunnery School, gunnery_school_pride]
    effect: [Ld, =8, inline]
    scope: reaches(gunnery_school, member_of)
    nature: origin
    category: organisation

  - rule: [Unpaid wages, unpaid_wages]
    effect: [Ld, -1]
    scope: commissioned_by_the_treasury
    trigger: in_force(wages_withheld, withholder = wissenland_treasury)
    nature: environment
    category: title

log:
  # Appended to the log as an event entry when the draft is deployed.
  - event: [Wages withheld, wages_withheld_2524]
    kind: wages_withheld
    roles: {withholder: wissenland_treasury}
    period: [2524]
