# Wissenland campaign rules (slice 1 brief §2.2, C1): unpaid wages in a package of its own,
# so a context can switch it off. It triggers on the world's hook "Treasury not paying"
# (defined in E1's sandbox): the game rule binds to the world hook.

package: [Wissenland campaign rules, wissenland_campaign_rules]
edition: wfb6
layer: campaign
requires: [e1_rules]

rules:
  - rule: [Unpaid wages, unpaid_wages]
    effect: [Ld, -1]
    scope: commissioned_by_the_treasury
    trigger: treasury_not_paying
    nature: environment
    category: title
