# E1 world (design/test-corpus-v2.md E1): a sandbox with one WFB 6th context.
# Read 2525 with "wages withheld" in force -> Ld 7. Withdraw that log entry -> 8.

sandbox: [E1 Nuln, e1]

# How places, organisations and titles stack for this world's rules (rules-overlay §12).
category_order:
  origin: [place, organisation, title]
  stationed: [place, organisation, title]

contexts:
  - context: [WFB 6th, wfb6]
    manifest: wfb6
    books: [e1_rules]
    campaign: [wissenland_campaign_rules]

things:
  - [Nuln, nuln, [settlement, polity]]
  - [Wissenland, wissenland, [polity]]
  - [Gunnery School, gunnery_school, [organisation]]
  - [Wissenland treasury, wissenland_treasury, [organisation]]
  - [Handgunners' commission, handgunner_commission, [commission]]

hooks:
  # A world item: what the game rules watch. Each game binds its own rule to it.
  - hook: [Treasury not paying, treasury_not_paying]
    when: in_force(wages_withheld, withholder = wissenland_treasury)

links:
  # [from, kind, to, start, end]
  - [nuln, in, wissenland, 2000]
  - [handgunner_commission, paid_by, wissenland_treasury, 2519]

units:
  - unit: [Nuln Handgunners, nuln_handgunners]
    raised: 2520
    profile: [3, 3, 3, 3, 3, 1, 3, 1, 7]   # the manifest's stat order: M WS BS S T W I A Ld
    links:
      # [kind, to, start, end]; start defaults to the raising date
      - [raised_at, nuln]
      - [member_of, gunnery_school]
      - [serves, handgunner_commission]
      - [stationed_at, nuln]
