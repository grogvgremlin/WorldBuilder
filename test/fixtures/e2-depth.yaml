# Wissenland (depth 1) then Nuln (depth 0) -> 8. Written @statline, 8 in any order.

package: [E2 Order by depth, e2_depth]
layer: book

things:
  - [Nuln, nuln, [settlement, polity]]
  - [Wissenland, wissenland, [polity]]

links:
  - [nuln, in, wissenland, 2000]

units:
  - unit: [Nuln Handgunners, nuln_handgunners]
    raised: 2520
    profile: [3, 3, 3, 3, 3, 1, 3, 1, 7]
    links:
      - [raised_at, nuln]

rules:
  - rule: [Wissenland discipline, wissenland_discipline]
    effect: [Ld, =7, inline]
    scope: reaches(wissenland, raised_at > in*)
    nature: origin
    category: place

  - rule: [Nuln civic pride, nuln_civic_pride]
    effect: [Ld, +1]
    scope: reaches(nuln, raised_at > in*)
    nature: origin
    category: place
